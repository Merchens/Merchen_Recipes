name: Import recipes and publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:          # "Run workflow" button on the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import new Google Form responses
        env:
          FORM_CSV_URL: ${{ vars.FORM_CSV_URL }}
        run: python scripts/import_form.py

      - name: Save new recipes to the repo
        run: |
          git config user.name "recipe-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _recipes scripts/imported.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new recipes."
          else
            git commit -m "Add recipes from Google Form"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
